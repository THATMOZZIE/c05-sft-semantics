[project]
name = "c05-sft-semantics"
version = "0.1.0"
description = "Tracing off-target animal-welfare drift and its causal contributors after rationale-rich SFT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.0",
    "numpy>=2.4.0",
    "pandas>=3.0.5",
    "peft>=0.18.1",
    "safetensors>=0.7.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformer-lens>=3.7.0",
    "transformers>=5.15.0",
]

[dependency-groups]
dev = [
    "catppuccin-jupyterlab==0.2.5",
    "ipykernel==7.3.0",
    "jupyter-collaboration>=5.0.0",
    "jupyter-mcp-tools>=0.1.7",
    "jupyterlab==4.6.2",
    "pycrdt>=0.14.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
